name: Build IKIMINA EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create App
        run: |
          mkdir app
          cd app
          echo {"name":"ikimina-2026","version":"3.0.0","main":"main.js"} > package.json
          echo const { app, BrowserWindow } = require('electron'); function createWindow(){ const win=new BrowserWindow({width:1280,height:800}); win.loadURL('https://ikimina2026.github.io/Ikimina/');} app.whenReady().then(createWindow); > main.js
          npm install electron electron-builder --save-dev
      - name: Build EXE
        run: |
          cd app
          npx electron-builder --win --publish=never
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: IKIMINA-EXE
          path: app/dist/
